<title>Triaje de Proyectos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Zilla+Slab:wght@500;600;700&display=swap">

<style>
:root{
  --paper:#f1f4f4;
  --surface:#ffffff;
  --surface-2:#e8eded;
  --desk:#dbe3e3;
  --ink:#16232a;
  --ink-soft:#54666e;
  --ink-faint:#84969c;
  --rule:#cfdadc;
  --rule-soft:#e0e8e9;
  --accent:#16606f;
  --accent-ink:#0e4552;
  --accent-soft:#dfecee;
  --crit:#9c2b2b;
  --crit-soft:#f4e3e2;
  --warn:#8a6111;
  --warn-soft:#f6ecd9;
  --ok:#3a6647;
  --ok-soft:#e2eee5;
  --leaf:#ffffff;
  --leaf-edge:#e6ecec;
  --shadow:0 1px 2px rgba(22,35,42,.06),0 8px 24px -16px rgba(22,35,42,.28);
  --booksh:0 2px 6px rgba(22,35,42,.10),0 24px 60px -28px rgba(22,35,42,.45);
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --slab:"Zilla Slab","IBM Plex Serif",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0e1519; --surface:#151f24; --surface-2:#1c282e; --desk:#0a1013;
    --ink:#dfe8e9; --ink-soft:#9aabb1; --ink-faint:#71858c;
    --rule:#2a383e; --rule-soft:#212e34;
    --accent:#5cb9c9; --accent-ink:#8ad3df; --accent-soft:#123039;
    --crit:#e98a88; --crit-soft:#3a1f1f;
    --warn:#d9a94a; --warn-soft:#332714;
    --ok:#82bb90; --ok-soft:#1a2f21;
    --leaf:#18232a; --leaf-edge:#223037;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.7);
    --booksh:0 2px 6px rgba(0,0,0,.5),0 24px 60px -28px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --paper:#0e1519; --surface:#151f24; --surface-2:#1c282e; --desk:#0a1013;
  --ink:#dfe8e9; --ink-soft:#9aabb1; --ink-faint:#71858c;
  --rule:#2a383e; --rule-soft:#212e34;
  --accent:#5cb9c9; --accent-ink:#8ad3df; --accent-soft:#123039;
  --crit:#e98a88; --crit-soft:#3a1f1f;
  --warn:#d9a94a; --warn-soft:#332714;
  --ok:#82bb90; --ok-soft:#1a2f21;
  --leaf:#18232a; --leaf-edge:#223037;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.7);
  --booksh:0 2px 6px rgba(0,0,0,.5),0 24px 60px -28px rgba(0,0,0,.9);
}

/* ---- StPageFlip base (inlineado: el CSP bloquea la hoja externa) ---- */
.stf__parent{position:relative;display:block;box-sizing:border-box;transform:translateZ(0);-ms-touch-action:pan-y;touch-action:pan-y}
.sft__wrapper{position:relative;width:100%;box-sizing:border-box}
.stf__parent canvas{position:absolute;width:100%;height:100%;left:0;top:0}
.stf__block{position:absolute;width:100%;height:100%;box-sizing:border-box;perspective:2000px}
.stf__item{display:none;position:absolute;transform-style:preserve-3d}
.stf__outerShadow,.stf__innerShadow,.stf__hardShadow,.stf__hardInnerShadow{position:absolute;left:0;top:0}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--slab);text-wrap:balance;margin:0;line-height:1.2}
p{margin:0}
a{color:var(--accent);text-underline-offset:2px}
a:hover{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}

.shell{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.rail{border-right:1px solid var(--rule);background:var(--surface);padding:22px 20px 40px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;flex-direction:column;gap:5px}
.brand h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}

.viewtoggle{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.viewtoggle button{flex:1;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;background:none;border:none;color:var(--ink-faint);padding:7px 4px;cursor:pointer}
.viewtoggle button[aria-pressed="true"]{background:var(--accent);color:#fff}
:root[data-theme="dark"] .viewtoggle button[aria-pressed="true"]{color:#0e1519}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .viewtoggle button[aria-pressed="true"]{color:#0e1519}}

.searchwrap{position:relative;display:flex;flex-direction:column;gap:6px}
.search{width:100%;font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:3px;padding:9px 11px 9px 30px}
.search::placeholder{color:var(--ink-faint)}
.search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.searchicon{position:absolute;left:10px;top:9px;width:14px;height:14px;color:var(--ink-faint);pointer-events:none}
.kbdhint{font-family:var(--mono);font-size:10px;color:var(--ink-faint);letter-spacing:.04em}

.axis{display:flex;flex-direction:column;gap:8px}
.axis > h2{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);padding-bottom:7px;border-bottom:1px solid var(--rule-soft)}
.chips{display:flex;flex-direction:column;gap:2px}
.chip{font-family:var(--sans);font-size:13.5px;text-align:left;background:none;border:none;border-left:2px solid transparent;color:var(--ink-soft);padding:5px 8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;transition:color .12s,border-color .12s,background .12s}
.chip:hover{color:var(--ink);background:var(--surface-2)}
.chip .n{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{color:var(--accent-ink);border-left-color:var(--accent);background:var(--accent-soft);font-weight:600}
.chip[aria-pressed="true"] .n{color:var(--accent)}
.reset{font-family:var(--mono);font-size:11px;color:var(--ink-faint);background:none;border:1px solid var(--rule);border-radius:3px;padding:6px 9px;cursor:pointer;letter-spacing:.04em}
.reset:hover{color:var(--ink);border-color:var(--ink-faint)}

/* ---- indice del libro ---- */
.toc{display:flex;flex-direction:column;gap:1px}
.toc button{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:baseline;background:none;border:none;border-left:2px solid transparent;text-align:left;padding:4px 8px;cursor:pointer;color:var(--ink-soft);font-family:var(--sans);font-size:12.5px;line-height:1.35}
.toc button:hover{background:var(--surface-2);color:var(--ink)}
.toc button .pg{font-family:var(--mono);font-size:10px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.toc button[data-here="1"]{border-left-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.toc .grp{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);padding:9px 8px 3px}

/* ---- escenario del libro ---- */
.main{min-width:0;display:flex;flex-direction:column}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px 24px 16px;background:var(--desk);min-height:100vh}
#book{box-shadow:var(--booksh)}
#book.is-portrait{box-shadow:none}
.bookbar{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:11px;color:var(--ink-soft);letter-spacing:.05em}
.bookbar button{font-family:var(--mono);font-size:11px;background:var(--surface);border:1px solid var(--rule);color:var(--ink-soft);padding:6px 13px;cursor:pointer;letter-spacing:.06em}
.bookbar button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.bookbar button:disabled{opacity:.35;cursor:default}
.bookbar .pos{font-variant-numeric:tabular-nums;min-width:88px;text-align:center}

/* ---- la hoja ---- */
.page{background:var(--leaf);border:1px solid var(--leaf-edge);overflow:hidden}
.page .inner{height:100%;padding:30px 30px 12px;display:flex;flex-direction:column;overflow:hidden}
.page .pagenum{margin-top:auto;padding-top:10px;font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);letter-spacing:.1em;display:flex;justify-content:space-between;border-top:1px solid var(--rule-soft)}

.page.cover{background:var(--accent);border-color:var(--accent)}
.page.cover .inner{justify-content:center;gap:16px;padding:44px 38px}
.page.cover h2{font-size:34px;font-weight:700;color:#fff;letter-spacing:-.02em}
.page.cover .csub{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.page.cover .cline{width:44px;height:2px;background:rgba(255,255,255,.5)}
.page.cover .cnote{font-size:14px;color:rgba(255,255,255,.86);line-height:1.55}
:root[data-theme="dark"] .page.cover h2,:root[data-theme="dark"] .page.cover .cnote{color:#0b1418}
:root[data-theme="dark"] .page.cover .csub{color:rgba(11,20,24,.66)}
:root[data-theme="dark"] .page.cover .cline{background:rgba(11,20,24,.45)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .page.cover h2,:root:not([data-theme="light"]) .page.cover .cnote{color:#0b1418}
  :root:not([data-theme="light"]) .page.cover .csub{color:rgba(11,20,24,.66)}
  :root:not([data-theme="light"]) .page.cover .cline{background:rgba(11,20,24,.45)}
}

/* ---- contenido de pagina: margenes en flex, no colapsan, medicion exacta ---- */
.pcontent{display:flex;flex-direction:column;flex:1;overflow-y:auto;overscroll-behavior:contain}
.u-head{margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:6px}
.u-head .idline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.u-head .fid{font-family:var(--mono);font-size:10px;color:var(--ink-faint);letter-spacing:.08em}
.u-head h3{font-size:19px;font-weight:600;line-height:1.22}
.u-cont{margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--rule-soft);font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--rule);color:var(--ink-faint);white-space:nowrap}
.tag.sev-alta{color:var(--crit);border-color:var(--crit);background:var(--crit-soft)}
.tag.sev-media{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.tag.sev-base{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.u-que{margin-bottom:13px;font-size:14px;color:var(--ink-soft);line-height:1.55}
.u-h4{margin-bottom:7px;font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint)}
.u-li{margin-bottom:6px;padding-left:15px;position:relative;font-size:13.5px;line-height:1.5}
.u-li::before{content:"";position:absolute;left:4px;top:8px;width:3px;height:3px;background:var(--ink-faint);border-radius:50%}
.u-li.last{margin-bottom:13px}
.u-alarma{margin-bottom:13px;background:var(--warn-soft);border-left:2px solid var(--warn);padding:8px 11px;font-size:13px;line-height:1.5}
.u-alarma strong{color:var(--warn)}
.u-ask{margin-bottom:13px;background:var(--surface-2);border:1px solid var(--rule-soft);padding:9px 11px;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);line-height:1.5}
.u-ask::before{content:"\203A ";color:var(--accent)}
.u-recs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.u-recs a{font-size:12px;text-decoration:none;border:1px solid var(--rule);padding:3px 8px;color:var(--accent);background:var(--surface)}
.u-recs a:hover{border-color:var(--accent);background:var(--accent-soft)}
.page code,#meas code{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);padding:1px 4px;border:1px solid var(--rule-soft)}
.u-sit-crit{margin-bottom:13px;font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:.05em;line-height:1.5}
.u-danger{margin-bottom:13px;background:var(--crit-soft);border-left:2px solid var(--crit);padding:9px 12px;font-size:13px;line-height:1.5}
.u-danger strong{color:var(--crit)}
.u-tocline{display:grid;grid-template-columns:1fr auto;gap:10px;font-size:12.5px;padding:3px 0;margin-bottom:2px;border-bottom:1px dotted var(--rule-soft);color:var(--ink-soft)}
.u-tocline .pg{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}

/* ---- medidor invisible ---- */
#meas{position:absolute;left:-99999px;top:0;visibility:hidden;pointer-events:none}

/* ---- modo lista ---- */
.listwrap{padding:34px 40px 80px;display:none}
.listwrap.on{display:block}
.stage.off{display:none}
.col{max-width:74ch;display:flex;flex-direction:column;gap:24px}
.listhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--rule);padding-bottom:8px}
.listhead h3{font-size:15px;font-weight:600}
.listhead .count{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.ficha{border-bottom:1px solid var(--rule-soft)}
.ficha > .head{width:100%;background:none;border:none;cursor:pointer;text-align:left;padding:13px 4px;display:grid;grid-template-columns:66px minmax(0,1fr) auto;gap:14px;align-items:baseline;color:var(--ink);font-family:var(--sans)}
.ficha > .head:hover{background:var(--surface-2)}
.ficha .id{font-family:var(--mono);font-size:11px;color:var(--ink-faint);letter-spacing:.04em}
.ficha .t{font-size:15.5px;font-weight:500;line-height:1.35}
.ficha .tags{display:flex;gap:5px;flex-wrap:wrap;justify-self:end}
.lbody{padding:2px 4px 22px 84px;display:flex;flex-direction:column;gap:14px}
.empty{padding:34px 4px;color:var(--ink-soft);font-size:15px}
.warnbox{background:var(--warn-soft);border-left:2px solid var(--warn);padding:11px 14px;font-size:13.5px;margin-bottom:20px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:none;border-bottom:1px solid var(--rule)}
  .stage{padding:16px 12px;min-height:auto}
  .listwrap{padding:22px 18px 60px}
  .lbody{padding-left:4px}
  .ficha > .head{grid-template-columns:56px minmax(0,1fr);gap:10px}
  .ficha .tags{grid-column:2;justify-self:start;margin-top:4px}
  .kbdhint{display:none}
}
</style>

<div class="shell">
  <aside class="rail">
    <div class="brand">
      <h1>Triaje de Proyectos</h1>
      <span class="sub">Manual de campo</span>
    </div>

    <div class="viewtoggle" role="group" aria-label="Modo de lectura">
      <button type="button" id="vBook" aria-pressed="true">Libro</button>
      <button type="button" id="vList" aria-pressed="false">Lista</button>
    </div>

    <div class="searchwrap">
      <svg class="searchicon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5L14 14"></path>
      </svg>
      <input id="q" class="search" type="search" placeholder="Buscar en el manual" aria-label="Buscar fichas" autocomplete="off">
      <span class="kbdhint">/ busca · ← → pasan página</span>
    </div>

    <nav class="axis">
      <h2>Por situación</h2>
      <div class="chips" id="sitChips"></div>
    </nav>

    <nav class="axis">
      <h2>Por dominio</h2>
      <div class="chips" id="domChips"></div>
    </nav>

    <button class="reset" id="reset" type="button">Limpiar filtros</button>

    <nav class="axis">
      <h2>Índice</h2>
      <div class="toc" id="toc"></div>
    </nav>
  </aside>

  <main class="main">
    <div class="stage" id="stage">
      <div id="book"></div>
      <div class="bookbar">
        <button type="button" id="prev">← Anterior</button>
        <span class="pos" id="pos"></span>
        <button type="button" id="next">Siguiente →</button>
      </div>
    </div>

    <div class="listwrap" id="listwrap">
      <div class="col">
        <div id="listwarn"></div>
        <div class="listhead">
          <h3 id="listTitle">Todas las fichas</h3>
          <span class="count" id="count"></span>
        </div>
        <div id="fichas"></div>
      </div>
    </div>
  </main>
</div>

<div id="meas"></div>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
const SITS = [
  {
    id:'nuevo', code:'SIT-NUE', name:'Empiezo de cero',
    crit:'Menos de 30 commits, o menos de 90 días de vida, y sin tags de release.',
    riesgo:'Todo lo que decidas ahora es barato de cambiar y caro de revertir en un año. El error caro de esta fase no es elegir mal el framework, es dejar entrar un secreto al historial o arrancar sin forma de saber si algo se rompe.',
    orden:[
      'Cierra la gestión de secretos antes del primer despliegue, no después.',
      'Un test que ejerza el camino crítico completo, aunque sea uno solo.',
      'CI que corra ese test en cada push. Sin esto, el test se pudre en un mes.',
      'Fija el lockfile y versiónalo desde el primer día.'
    ],
    noTocar:'No montes abstracciones para casos que todavía no tienes. La arquitectura que aguanta es la que se descubre con el tercer caso de uso, no la que se diseña antes del primero.'
  },
  {
    id:'vivo', code:'SIT-VIV', name:'Está vivo y en marcha',
    crit:'Commit en los últimos 30 días, dos o más autores activos, y CI presente.',
    riesgo:'El riesgo no es el código, es el ritmo. Un equipo que entrega rápido acumula deuda en los sitios que nadie revisa: dependencias, permisos por recurso y los caminos que la CI no cubre.',
    orden:[
      'Revisa el diff pendiente antes que nada. Es lo único que puede romperse hoy.',
      'Audita dependencias: es lo que se degrada solo, sin que nadie toque nada.',
      'Busca huecos de cobertura en las rutas críticas, no el porcentaje global.',
      'Comprueba control de acceso por recurso en cada endpoint nuevo.'
    ],
    noTocar:'No abras un refactor amplio mientras hay entregas en curso. Compite por los mismos ficheros y garantiza conflictos.'
  },
  {
    id:'mantenimiento', code:'SIT-MAN', name:'En mantenimiento',
    crit:'Último commit entre 30 días y 12 meses, y lo reciente son fixes o bumps de dependencias.',
    riesgo:'Nadie tiene el contexto completo en la cabeza. Las suposiciones que el equipo original daba por obvias ya no están escritas en ningún sitio, y el coste de cada cambio se dispara por eso, no por la calidad del código.',
    orden:[
      'Arranca el proyecto en frío desde cero y anota todo lo que falla. Ese es el estado real.',
      'Audita dependencias a fondo: aquí es donde se acumula el riesgo silencioso.',
      'Comprueba que la CI sigue verde y que sigue ejecutando algo de verdad.',
      'Documenta lo que descubras al arrancarlo. Es el entregable más valioso de esta fase.'
    ],
    noTocar:'No actualices dependencias en masa. Una por una, con la CI verde entre medias, o no sabrás cuál rompió qué.'
  },
  {
    id:'legacy', code:'SIT-LEG', name:'Heredé algo abandonado',
    crit:'Sin commits en 12 meses o más. O bien: sin tests y sin CI, con más de 500 ficheros.',
    riesgo:'No tienes red de seguridad. Cualquier cambio que hagas puede romper algo sin que nada te avise, y no hay nadie a quien preguntar. La tentación de reescribir es fuerte y casi siempre es un error.',
    orden:[
      'Secretos en el historial, lo primero. Credenciales de hace años siguen siendo credenciales.',
      'Consigue arrancarlo. Hasta que no arranque, todo lo demás es especulación.',
      'Inventaria la superficie expuesta: qué puertos, qué rutas, qué jobs.',
      'Antes de cambiar nada, escribe un test que ejerza el camino que vas a tocar.'
    ],
    noTocar:'No borres código que parezca muerto y no reescribas por partes. Sin tests no puedes demostrar que preservas el comportamiento, y aquí preservarlo es todo el trabajo.'
  }
];

const DOMS = [
  {id:'seguridad', name:'Seguridad'},
  {id:'calidad', name:'Calidad y tests'},
  {id:'frontend', name:'Frontend'},
  {id:'backend', name:'Backend'},
  {id:'proceso', name:'Proceso y entrega'},
  {id:'claude', name:'Trabajar con Claude'}
];

const F = [
  {

let flip = null, pageIndex = [], pageCount = 0, lastSize = {w:0,h:0};
const openList = new Set();

const $ = s => document.querySelector(s);
const el = (t,c,x) => { const n = document.createElement(t); if(c) n.className=c; if(x!=null) n.textContent=x; return n; };
const eh = (t,c,h) => { const n = document.createElement(t); if(c) n.className=c; n.innerHTML=h; return n; };

function match(f){
  if (fSit && !f.sit.includes(fSit)) return false;
  if (fDom && f.dom !== fDom) return false;
  if (fQ){
    const hay = (f.id+' '+f.t+' '+f.que+' '+f.comp.join(' ')+' '+f.alarma+' '+f.ask)
      .toLowerCase().replace(/<[^>]+>/g,'');
    if (!hay.includes(fQ)) return false;
  }
  return true;
}
const domName = id => DOMS.find(d => d.id === id).name;

    h.append(line, el('h3',null,f.t));
    return h;
  }});
  u.push({make:() => eh('p','u-que',f.que)});
  u.push({keep:true, make:() => el('div','u-h4','Cómo comprobarlo')});
  f.comp.forEach((c,i) => u.push({make:() => {
    const d = eh('div','u-li'+(i===f.comp.length-1?' last':''), c);
    return d;
  }}));
  u.push({make:() => {
    const d = el('div','u-alarma');
    d.append(el('strong',null,'Señal de alarma. '));
    const sp = document.createElement('span'); sp.innerHTML = f.alarma; d.append(sp);
    return d;
  }});
  u.push({keep:true, make:() => el('div','u-h4','Pídeselo así')});
  u.push({make:() => el('div','u-ask',f.ask)});
  if (f.rec.length){
    u.push({keep:true, make:() => el('div','u-h4','Para leer')});
    u.push({make:() => {
      const d = el('div','u-recs');
      f.rec.forEach(r => { const a = el('a',null,r.t); a.href=r.u; a.target='_blank'; a.rel='noopener noreferrer'; d.append(a); });
      return d;
    }});
  }
  return u;
}

function sitUnits(s){
  const u = [];
  u.push({keep:true, make:() => {
    const h = el('div','u-head');
    const line = el('div','idline');
    line.append(el('span','fid',s.code));
    line.append(el('span','tag','situación'));
    h.append(line, el('h3',null,s.name));
    return h;
  }});
  u.push({make:() => el('div','u-sit-crit','Cómo saber que estás aquí: '+s.crit)});
  u.push({keep:true, make:() => el('div','u-h4','El riesgo real')});
  u.push({make:() => el('p','u-que',s.riesgo)});
  u.push({keep:true, make:() => el('div','u-h4','Orden de trabajo')});
  s.orden.forEach((o,i) => u.push({make:() => el('div','u-li'+(i===s.orden.length-1?' last':''), o)}));
  u.push({make:() => {
    const d = el('div','u-danger');
    d.append(el('strong',null,'Qué no tocar todavía. '));
    d.append(document.createTextNode(s.noTocar));
    return d;
  }});
  return u;
}

/* ---------------- paginacion real ---------------- */

const meas = $('#meas');
function measBox(w){
  meas.replaceChildren();
  const box = el('div','pcontent');
  box.style.width = (w - 60) + 'px';
  box.style.flex = 'none';
  box.style.overflow = 'visible';
  meas.append(box);
  return box;
}

// Reparte las unidades en tantas hojas como haga falta, partiendo por limites
// de seccion. Las unidades marcadas keep arrastran a la siguiente hoja en vez
// de quedarse colgadas al final de una.
function paginate(units, w, h){
  const budget = h - CHROME;
  const out = [];
  let cur = [], box = measBox(w);

  const fits = () => box.scrollHeight <= (out.length === 0 ? budget : budget - CONT_RESERVE);

  for (const u of units){
    box.append(u.make());
    cur.push(u);
    if (!fits() && cur.length > 1){
      cur.pop();
      box.lastChild.remove();
      const carry = [];
      while (cur.length && cur[cur.length-1].keep) carry.unshift(cur.pop());
      out.push(cur);
      cur = []; box = measBox(w);
      for (const c of carry){ box.append(c.make()); cur.push(c); }
      box.append(u.make()); cur.push(u);
    }
  }
  if (cur.length) out.push(cur);
  return out;
}

/* ---------------- construccion de hojas ---------------- */

function shell(cls){
  const p = el('div','page'+(cls?' '+cls:''));
  const inner = el('div','inner');
  p.append(inner);
  return {p, inner};
}

function folio(inner, left, right){
  const f = el('div','pagenum');
  f.append(el('span',null,left||''), el('span',null,right||''));
  inner.append(f);
}

function contentPage(units, contLabel, folioL, folioR){
  const {p, inner} = shell();
  const c = el('div','pcontent');
  if (contLabel) c.append(el('div','u-cont',contLabel));
  units.forEach(u => c.append(u.make()));
  inner.append(c);
  folio(inner, folioL, folioR);
  return p;
}

function coverPage(n){
  const {p, inner} = shell('cover');
  p.setAttribute('data-density','hard');
  inner.append(el('span','csub','Manual de campo'));
  inner.append(el('h2',null,'Triaje de Proyectos'));
  inner.append(el('div','cline'));
  inner.append(el('p','cnote','Qué mirar, en qué orden, y qué no tocar todavía, cuando entras en un proyecto que no conoces.'));
  inner.append(el('p','cnote',n+' fichas · cuatro situaciones · seis dominios'));
  return p;
}

function backPage(){
  const {p, inner} = shell('cover');
  p.setAttribute('data-density','hard');
  inner.append(el('div','cline'));
  inner.append(el('p','cnote','Los enlaces apuntan a la entrada canónica de cada recurso y no a páginas concretas: las rutas profundas se rompen, las raíces no.'));
  inner.append(el('p','cnote','Ninguna ficha sustituye a leer el código.'));
  return p;
}

function guidePage(sitPages, total){
  const {p, inner} = shell();
  const c = el('div','pcontent');
  const h = el('div','u-head');
  const gl = el('div','idline'); gl.append(el('span','fid','CÓMO LEERLO'));
  h.append(gl, el('h3',null,'Empieza por la situación'));
  c.append(h);
  c.append(el('p','u-que','El orden de trabajo cambia mucho más entre un proyecto vivo y uno abandonado que entre Node y Python. Localiza en cuál estás y ve a su página.'));
  c.append(el('div','u-h4','Las cuatro situaciones'));
  SITS.forEach(s => {
    const line = el('div','u-tocline');
    line.append(el('span',null,s.name));
    line.append(el('span','pg', sitPages[s.id] != null ? String(sitPages[s.id]+1) : '--'));
    c.append(line);
  });
  c.append(el('div','u-ask','Pasa página arrastrando la esquina, con las flechas del teclado, o salta desde el índice de la izquierda.'));
  inner.append(c);
  folio(inner, 'Guía', '2 / '+total);
  return p;
}

/* ---------------- ensamblado del libro ---------------- */

function computeSize(){
  const stage = $('#stage');
  const availW = Math.max(240, stage.clientWidth - 48);
  const availH = Math.max(320, window.innerHeight - 132);
  const portrait = availW < 760;
  let h = Math.min(availH, 700);
  let w = h * RATIO;
  const maxW = portrait ? availW : (availW - 20) / 2;
  if (w > maxW){ w = maxW; h = w / RATIO; }
  w = Math.max(248, Math.min(520, w));
  h = Math.max(340, Math.min(740, h));
  if (h > availH){ h = availH; w = Math.max(248, h * RATIO); }
  return {w: Math.round(w), h: Math.round(h)};
}

function buildPages(size){
  const rows = F.filter(match);
  const sits = fSit ? SITS.filter(s => s.id === fSit) : (fDom || fQ ? [] : SITS);

  const body = [];              // hojas de contenido, sin portadas
  const index = [];             // entradas para el indice del rail
  const sitPages = {};

  const OFFSET = 2;             // 0 portada, 1 guia

  sits.forEach(s => {
    const chunks = paginate(sitUnits(s), size.w, size.h);
    sitPages[s.id] = OFFSET + body.length;
    index.push({kind:'sit', label:s.name, page:OFFSET + body.length, id:s.id});
    chunks.forEach((units,i) => body.push(
      contentPage(units, i ? s.code+' · continúa' : null, s.code, null)
    ));
  });

  let lastDom = null;
  rows.forEach(f => {
    const chunks = paginate(fichaUnits(f), size.w, size.h);
    index.push({kind:'ficha', label:f.t, page:OFFSET + body.length, id:f.id,
                dom:f.dom, newGroup: f.dom !== lastDom});
    lastDom = f.dom;
    chunks.forEach((units,i) => body.push(
      contentPage(units, i ? f.id+' · continúa' : null, f.id, null)
    ));
  });

  // paridad: el contenido debe ocupar un numero par de hojas para que la
  // contraportada caiga sola, igual que la portada
  const contentCount = 1 + body.length;           // guia + cuerpo
  if (contentCount % 2 !== 0) body.push(contentPage([], null, null, null));

  const total = 2 + 1 + body.length;              // portadas + guia + cuerpo
  const pages = [coverPage(rows.length), guidePage(sitPages, total), ...body, backPage()];

  // folio real, ya conocido el total
  pages.forEach((p,i) => {
    const f = p.querySelector('.pagenum');
    if (f && f.children[1] && !f.children[1].textContent) f.children[1].textContent = (i+1)+' / '+total;
  });

  return {pages, index, total};
}

function mount(){
  const stage = $('#stage');
  const host = $('#book');
  const size = computeSize();
  const built = buildPages(size);
  pageIndex = built.index;
  pageCount = built.total;
  lastSize = size;

  if (flip){ try { flip.destroy(); } catch(e){} flip = null; }
  host.replaceChildren();
  built.pages.forEach(p => {
    p.style.width = size.w+'px';
    p.style.height = size.h+'px';
    host.append(p);
  });

  flip = new St.PageFlip(host, {
    width: size.w, height: size.h,
    size: 'fixed',
    showCover: true,
    usePortrait: true,
    maxShadowOpacity: 0.5,
    flippingTime: 700,
    disableFlipByClick: true,      // los enlaces de la ficha no deben pasar pagina
    clickEventForward: true,
    mobileScrollSupport: true
  });
  flip.loadFromHTML(host.querySelectorAll('.page'));
  flip.on('flip', () => syncPos());
  flip.on('changeOrientation', e => host.classList.toggle('is-portrait', e.data === 'portrait'));
  syncPos();
  renderToc();
}

function syncPos(){
  if (!flip) return;
  const i = flip.getCurrentPageIndex();
  $('#pos').textContent = (i+1)+' / '+pageCount;
  $('#prev').disabled = i <= 0;
  $('#next').disabled = i >= pageCount-1;
  let best = null;
  pageIndex.forEach(e => { if (e.page <= i && (!best || e.page > best.page)) best = e; });
  document.querySelectorAll('#toc button').forEach(b => {
    b.dataset.here = (best && b.dataset.id === best.id) ? '1' : '0';
  });
}

/* ---------------- indice del rail ---------------- */

function renderToc(){
  const t = $('#toc');
  t.replaceChildren();
  if (view !== 'libro'){ t.append(el('div','grp','solo en modo libro')); return; }
  if (!pageIndex.length){ t.append(el('div','grp','sin resultados')); return; }

  let group = null;
  pageIndex.forEach(e => {
    if (e.kind === 'sit' && group !== 'sit'){ t.append(el('div','grp','Situaciones')); group='sit'; }
    if (e.kind === 'ficha' && e.newGroup){ t.append(el('div','grp', domName(e.dom))); group='ficha'; }
    const b = el('button');
    b.type='button'; b.dataset.page = String(e.page); b.dataset.id = e.id; b.dataset.here='0';
    b.append(el('span',null,e.label), el('span','pg',String(e.page+1)));
    b.addEventListener('click', () => { if (flip) flip.flip(e.page); });
    t.append(b);
  });
}

/* ---------------- filtros ---------------- */

function renderChips(){
  const sc = $('#sitChips'); sc.replaceChildren();
  SITS.forEach(s => {
    const b = el('button','chip'); b.type='button';
    b.setAttribute('aria-pressed', String(fSit === s.id));
    b.append(el('span',null,s.name), el('span','n',String(F.filter(f => f.sit.includes(s.id)).length)));
    b.addEventListener('click', () => { fSit = fSit===s.id ? null : s.id; rebuild(); });
    sc.append(b);
  });
  const dc = $('#domChips'); dc.replaceChildren();
  DOMS.forEach(d => {
    const b = el('button','chip'); b.type='button';
    b.setAttribute('aria-pressed', String(fDom === d.id));
    b.append(el('span',null,d.name), el('span','n',String(F.filter(f => f.dom===d.id).length)));
    b.addEventListener('click', () => { fDom = fDom===d.id ? null : d.id; rebuild(); });
    dc.append(b);
  });
}

/* ---------------- modo lista ---------------- */

function renderList(){
  const list = $('#fichas'); list.replaceChildren();
  const rows = F.filter(match);
  $('#count').textContent = rows.length + (rows.length===1 ? ' ficha' : ' fichas');
  let title = 'Todas las fichas';
  if (fSit && fDom) title = SITS.find(s=>s.id===fSit).name+' · '+domName(fDom);
  else if (fSit) title = 'Fichas para: '+SITS.find(s=>s.id===fSit).name;
  else if (fDom) title = domName(fDom);
  if (fQ) title += ' · buscando "'+fQ+'"';
  $('#listTitle').textContent = title;

  if (!rows.length){ list.append(el('div','empty','Ninguna ficha coincide. Prueba a quitar un filtro o a buscar otra cosa.')); return; }

  rows.forEach(f => {
    const art = el('article','ficha');
    const isOpen = openList.has(f.id);
    const head = el('button','head'); head.type='button';
    head.setAttribute('aria-expanded', String(isOpen));
    head.append(el('span','id',f.id), el('span','t',f.t));
    const tags = el('span','tags');
    tags.append(el('span','tag sev-'+f.sev, SEV[f.sev]), el('span','tag', domName(f.dom)));
    head.append(tags);
    const body = el('div','lbody');
    body.hidden = !isOpen;
    fichaUnits(f).forEach(u => body.append(u.make()));
    head.addEventListener('click', () => {
      if (openList.has(f.id)) openList.delete(f.id); else openList.add(f.id);
      const now = openList.has(f.id);
      body.hidden = !now; head.setAttribute('aria-expanded', String(now));
    });
    art.append(head, body);
    list.append(art);
  });
}

/* ---------------- orquestacion ---------------- */

function setView(v){
  view = v;
  $('#vBook').setAttribute('aria-pressed', String(v==='libro'));
  $('#vList').setAttribute('aria-pressed', String(v==='lista'));
  $('#stage').classList.toggle('off', v!=='libro');
  $('#listwrap').classList.toggle('on', v!=='libro');
  rebuild();
}

function rebuild(){
  renderChips();
  if (view === 'libro' && window.St && St.PageFlip){ mount(); }
  else { renderList(); renderToc(); }
}

$('#q').addEventListener('input', e => { fQ = e.target.value.trim().toLowerCase(); rebuild(); });
$('#reset').addEventListener('click', () => { fSit=null; fDom=null; fQ=''; $('#q').value=''; rebuild(); });
$('#vBook').addEventListener('click', () => setView('libro'));
$('#vList').addEventListener('click', () => setView('lista'));
$('#prev').addEventListener('click', () => flip && flip.flipPrev());
$('#next').addEventListener('click', () => flip && flip.flipNext());

document.addEventListener('keydown', e => {
  const typing = document.activeElement === $('#q');
  if (e.key === '/' && !typing){ e.preventDefault(); $('#q').focus(); return; }
  if (e.key === 'Escape' && typing){ $('#q').blur(); return; }
  if (typing || view !== 'libro' || !flip) return;
  if (e.key === 'ArrowLeft'){ e.preventDefault(); flip.flipPrev(); }
  if (e.key === 'ArrowRight'){ e.preventDefault(); flip.flipNext(); }
});

let rt;
window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    if (view !== 'libro' || !flip) return;
    const s = computeSize();
    if (Math.abs(s.w-lastSize.w) > 8 || Math.abs(s.h-lastSize.h) > 8) mount();
  }, 260);
});

function boot(){
if (!window.St || !St.PageFlip){
  $('#listwarn').append(eh('div','warnbox',
    '<strong>El modo libro no está disponible.</strong> La librería de paginado no cargó, así que el manual se muestra como lista. El contenido es el mismo.'));
  setView('lista');
} else {
  setView('libro');
}
}

// Paginar antes de que la tipografia este lista mide con la fuente de respaldo
// y todo desborda al hacer swap. Esperamos, con salida por tiempo por si acaso.
if (document.fonts && document.fonts.ready){
  Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 2500))]).then(boot);
} else {
  boot();
}

</script>
